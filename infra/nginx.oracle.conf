# Dedicated initial production hostname. Existing fattech.com.br remains unchanged.
server {
    listen 80;
    server_name fattechcrmpro.64.181.178.125.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/fattechcrmpro-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name fattechcrmpro.64.181.178.125.nip.io;
    ssl_certificate /etc/letsencrypt/live/fattechcrmpro.64.181.178.125.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fattechcrmpro.64.181.178.125.nip.io/privkey.pem;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Avoid indexing a duplicate of the future primary company domain.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
